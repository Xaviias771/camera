<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Cat Loader</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.3s ease;
    }

    #message {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 32px;
      font-weight: bold;
      color: white;
      white-space: nowrap;
      text-shadow: -2px -2px 0 black, 2px -2px 0 black, -2px 2px 0 black, 2px 2px 0 black;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      z-index: 10;
    }

    #camera {
      width: 150px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 2s ease-in-out;
      margin-bottom: 20px;
    }

    #flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: white;
      opacity: 0;
      z-index: 5;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    #loadingContainer {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #loadingText {
      color: white;
      font-size: 24px;
      font-weight: bold;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    #progressBar {
      width: 300px;
      height: 20px;
      background-color: #444;
      border-radius: 10px;
      overflow: hidden;
    }

    #progress {
      height: 100%;
      width: 0%;
      background-color: limegreen;
      transition: width 5s linear;
    }

    #catImage {
      display: none;
      border: 5px solid white;
      margin-bottom: 120px;
      max-width: 90%;
      max-height: 60vh;
    }

    button {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: white;
      font-size: 16px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      z-index: 2;
      transition: opacity 0.5s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    button.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="flash"></div>
  <div id="message">Look at you! &#128522;</div>
  <img id="camera" src="camera.png" alt="Camera">
  <button id="startBtn">Push Me</button>

  <div id="loadingContainer">
    <div id="loadingText">Loading...</div>
    <div id="progressBar">
      <div id="progress"></div>
    </div>
  </div>

  <img id="catImage" src="cat.jpg" alt="Cat">

  <script>
    const startBtn = document.getElementById('startBtn');
    const camera = document.getElementById('camera');
    const flash = document.getElementById('flash');
    const loadingContainer = document.getElementById('loadingContainer');
    const progress = document.getElementById('progress');
    const catImage = document.getElementById('catImage');
    const message = document.getElementById('message');

    startBtn.addEventListener('click', () => {
      startBtn.classList.add('hidden');

      camera.style.visibility = 'visible';
      camera.style.opacity = 1;

      setTimeout(() => {
        flash.style.opacity = 1;

        setTimeout(() => {
          flash.style.opacity = 0;
          camera.style.opacity = 0;
          camera.style.visibility = 'hidden';

          loadingContainer.style.display = 'flex';
          progress.style.width = '100%';

          setTimeout(() => {
            loadingContainer.style.display = 'none';
            catImage.style.display = 'block';
            message.style.opacity = 1;
          }, 5000);

        }, 300);
      }, 2500);
    });
  </script>
</body>
</html>
